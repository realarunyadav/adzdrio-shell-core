name: ABOS Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # CI only needs a syntactically valid endpoint to compile the browser bundle.
      # The real production URL is supplied by the hosting environment.
      VITE_API_BASE_URL: https://ci.invalid.example
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build production bundle
        run: bun run build
